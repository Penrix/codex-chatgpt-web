name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate launcher installer with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          $source = Get-Content scripts/install-launcher.ps1 -Raw
          [void][scriptblock]::Create($source)
          if ($source.Contains("IsPathFullyQualified")) {
            throw "The Windows PowerShell 5.1 installer cannot use the .NET Core-only IsPathFullyQualified API"
          }
          if (-not [Environment]::Is64BitOperatingSystem) {
            throw "The Windows CI runner must be 64-bit"
          }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -GitHubEnv $env:GITHUB_ENV
      - name: Prepare compatible Linux libnotify
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libglib2.0-dev libgdk-pixbuf-2.0-dev binutils
          ./scripts/prepare-linux-libnotify.sh
      - name: Prepare owned AppImage toolset
        if: runner.os == 'Linux'
        run: bun run launcher/scripts/prepare-linux-appimage-tools.cjs
      - run: bun run verify
      - run: bun run app:package
      - name: Verify Linux AppImage ABI on current Arch
        if: runner.os == 'Linux'
        run: |
          artifact="$(find launcher/artifacts -maxdepth 1 -name '*-linux-x64.AppImage' -print -quit)"
          test -n "$artifact"
          docker run --rm -v "$PWD:/work:ro" -e APPIMAGE_PATH="/work/$artifact" archlinux:base \
            sh -lc 'pacman -Sy --noconfirm binutils file glibc alsa-lib at-spi2-core cairo cups gtk3 libx11 libxcb libxcomposite libxdamage libxext libxfixes libxkbcommon libxrandr mesa nspr nss pango >/dev/null && /work/launcher/scripts/smoke-linux-appimage-symbols.sh "$APPIMAGE_PATH"'
      - name: Ensure virtual display is available
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: bun run app:smoke

  standalone-codex-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Prepare official standalone Codex CLI 0.152.1
        shell: pwsh
        run: |
          $url = "https://github.com/openai/codex/releases/download/rust-v0.152.1/codex-package-x86_64-pc-windows-msvc.tar.gz"
          $expectedSha256 = "44fc7869dddc9abd3508b46d92f7a2cebf95b58595963f92a6dd734cca6db25b"
          $archive = Join-Path $env:RUNNER_TEMP "codex-package-x86_64-pc-windows-msvc.tar.gz"
          $root = Join-Path $env:RUNNER_TEMP "codex-0.152.1"

          curl.exe -fL --retry 3 --retry-delay 2 $url -o $archive
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download official Codex CLI 0.152.1 package"
          }

          $actualSha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Codex CLI archive checksum mismatch: expected $expectedSha256, got $actualSha256"
          }

          New-Item -ItemType Directory -Force -Path $root | Out-Null
          tar.exe -xzf $archive -C $root
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract official Codex CLI package"
          }

          $codex = Join-Path $root "bin\codex.exe"
          if (-not (Test-Path -LiteralPath $codex -PathType Leaf)) {
            throw "Official Codex package did not contain bin\codex.exe"
          }

          $version = (& $codex --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Official Codex CLI failed to report its version: $version"
          }
          if ($version -notmatch '0\.152\.1') {
            throw "Expected Codex CLI 0.152.1, got: $version"
          }

          "CODEX_SMOKE_CLI=$codex" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using $version from $codex"
      - name: Verify Codex Web GPT model catalog contract
        shell: pwsh
        run: bun run scripts/smoke-codex-catalog.ts "$env:CODEX_SMOKE_CLI"

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -config-file .github/actionlint.yaml .github/workflows/*.yml
