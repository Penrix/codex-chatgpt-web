name: Apply static catalog compatibility fix v4

on:
  push:
    branches: [fix/windows-codex-026903-static-catalog]
    paths: [.github/workflows/apply-static-catalog-fix-v4.yml]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/windows-codex-026903-static-catalog
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Generate and correct compatibility patch
        shell: bash
        run: |
          python - <<'PYRUN'
          from pathlib import Path

          def run_embedded(path, marker, end_marker):
              workflow = Path(path).read_text(encoding='utf-8')
              start = workflow.index(marker) + len(marker)
              end = workflow.index(end_marker, start)
              body = workflow[start:end]
              script = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
              exec(compile(script, path, 'exec'))

          run_embedded(
              '.github/workflows/apply-static-catalog-fix.yml',
              "          python - <<'PY'\n",
              "\n          PY\n",
          )
          run_embedded(
              '.github/workflows/apply-static-catalog-fix-v3.yml',
              "          python - <<'PY'\n",
              "\n          PY\n",
          )

          p = Path('src/codex-integration.ts')
          text = p.read_text(encoding='utf-8')
          old = '''  const protocol = journalProtocol(existing);
          const appConfig = loadConfig();
          const managedCatalog = buildManagedWindowsCodexCatalog(appConfig);
          const hookConfig = existing.version === 10
            ? { interruptHookCommand: existing.interruptHook.command }
            : { runtimeCommand: appConfig.runtimeCommand };'''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '''  const protocol = journalProtocol(existing);
          const managedCatalog = process.platform === "win32"
            ? buildManagedWindowsCodexCatalog(loadConfig())
            : undefined;
          const hookConfig = existing.version === 10
            ? { interruptHookCommand: existing.interruptHook.command }
            : { runtimeCommand: loadConfig().runtimeCommand };'''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if text.count(old) != 1:
              raise SystemExit(f'activate app-config anchor count was {text.count(old)}')
          text = text.replace(old, new, 1)

          activate = text[text.index('export function activateCodexIntegration'):text.index('export function uninstallCodexIntegration')]
          if 'const appConfig = loadConfig();' in activate:
              raise SystemExit('activate still loads app config unconditionally')
          if activate.count('process.platform === "win32"') < 1:
              raise SystemExit('Windows-only catalog guard missing from activate')
          p.write_text(text, encoding='utf-8')
          PYRUN
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - run: bun run typecheck
      - run: bun test ./tests/codex-static-catalog.test.ts ./tests/codex-integration.test.ts ./tests/server-models.test.ts ./tests/native-passthrough.test.ts
      - run: bun run build
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex-bundled-catalog.ts src/codex-static-catalog-route.ts src/codex-integration.ts launcher/electron/main.cjs tests/codex-static-catalog.test.ts
          git commit -m "fix: install a managed static catalog for Windows Codex"
          git push origin HEAD:fix/windows-codex-026903-static-catalog
