name: Apply static catalog compatibility fix v5

on:
  push:
    branches: [fix/windows-codex-026903-static-catalog]
    paths: [.github/workflows/apply-static-catalog-fix-v5.yml]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/windows-codex-026903-static-catalog
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Generate and correct compatibility patch
        shell: bash
        run: |
          python - <<'PYRUN'
          from pathlib import Path

          def run_embedded(path, marker, end_marker):
              workflow = Path(path).read_text(encoding='utf-8')
              start = workflow.index(marker) + len(marker)
              end = workflow.index(end_marker, start)
              body = workflow[start:end]
              script = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
              exec(compile(script, path, 'exec'))

          run_embedded(
              '.github/workflows/apply-static-catalog-fix.yml',
              "          python - <<'PY'\n",
              "\n          PY\n",
          )
          run_embedded(
              '.github/workflows/apply-static-catalog-fix-v3.yml',
              "          python - <<'PY'\n",
              "\n          PY\n",
          )

          p = Path('src/codex-integration.ts')
          text = p.read_text(encoding='utf-8')
          start = text.index('export function activateCodexIntegration')
          end = text.index('export function uninstallCodexIntegration')
          activate = text[start:end]

          app_line = '  const appConfig = loadConfig();\n'
          catalog_line = '  const managedCatalog = buildManagedWindowsCodexCatalog(appConfig);\n'
          runtime_fragment = '{ runtimeCommand: appConfig.runtimeCommand };'
          if activate.count(app_line) != 1:
              raise SystemExit(f'activate appConfig declaration count was {activate.count(app_line)}')
          if activate.count(catalog_line) != 1:
              raise SystemExit(f'activate managed catalog line count was {activate.count(catalog_line)}')
          if activate.count(runtime_fragment) != 1:
              raise SystemExit(f'activate runtime fragment count was {activate.count(runtime_fragment)}')

          activate = activate.replace(app_line, '', 1)
          activate = activate.replace(
              catalog_line,
              '  const managedCatalog = process.platform === "win32"\n'
              '    ? buildManagedWindowsCodexCatalog(loadConfig())\n'
              '    : undefined;\n',
              1,
          )
          activate = activate.replace(runtime_fragment, '{ runtimeCommand: loadConfig().runtimeCommand };', 1)
          text = text[:start] + activate + text[end:]

          if 'const appConfig = loadConfig();' in activate:
              raise SystemExit('activate still loads app config unconditionally')
          if activate.count('process.platform === "win32"') < 1:
              raise SystemExit('Windows-only catalog guard missing from activate')
          p.write_text(text, encoding='utf-8')
          PYRUN
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - run: bun run typecheck
      - run: bun test ./tests/codex-static-catalog.test.ts ./tests/codex-integration.test.ts ./tests/server-models.test.ts ./tests/native-passthrough.test.ts
      - run: bun run build
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex-bundled-catalog.ts src/codex-static-catalog-route.ts src/codex-integration.ts launcher/electron/main.cjs tests/codex-static-catalog.test.ts
          git commit -m "fix: install a managed static catalog for Windows Codex"
          git push origin HEAD:fix/windows-codex-026903-static-catalog
