name: Apply active static catalog migration fix

on:
  push:
    branches:
      - fix/windows-codex-026903-static-catalog

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/windows-codex-026903-static-catalog
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Patch active v10 migration and add regression test
        run: python .github/scripts/apply-active-static-catalog-migration-fix.py
      - name: Run launcher regression tests
        run: node --test launcher/tests/runtime-host.test.cjs launcher/tests/runtime-install.test.cjs
      - name: Typecheck runtime source
        run: bun run typecheck
      - name: Build runtime bundle
        run: bun run build
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/electron/runtime.cjs launcher/tests/runtime-host.test.cjs
          git diff --cached --check
          git commit -m "fix: migrate active Windows integration to static catalog"
          git push origin HEAD:fix/windows-codex-026903-static-catalog
