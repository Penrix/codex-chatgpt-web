name: Fold runtime hotfixes

on:
  push:
    branches:
      - fix/standalone-cli-installer-v6
    paths:
      - .github/workflows/fold-runtime-hotfixes.yml

permissions:
  contents: write

jobs:
  fold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/standalone-cli-installer-v6
          fetch-depth: 0

      - name: Fold proven runtime hotfixes into committed source
        run: |
          node scripts/apply-v7-standalone-hotfix.cjs
          node scripts/apply-v7-health-discovery-hotfix.cjs
          node scripts/apply-v8-direct-tools-hotfix.cjs
          node scripts/apply-v8-direct-tools-import-fix.cjs
          node scripts/apply-v8-direct-tools-capability-hotfix.cjs
          node scripts/apply-v8-automatic-direct-guard-hotfix.cjs

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install launcher dependencies
        working-directory: launcher
        run: bun install --frozen-lockfile

      - name: Verify folded source before commit
        run: |
          bun test tests/model-catalog.test.ts tests/model-catalog-route-template.test.ts tests/chatgpt-web-direct-tools.test.ts tests/chatgpt-web-direct-capability.test.ts
          bunx tsc --noEmit

      - name: Commit folded source
        run: |
          if git diff --quiet; then
            echo "No source changes were produced by the hotfix fold"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src launcher scripts
          git commit -m "refactor: fold runtime hotfixes into source"
          git push origin HEAD:fix/standalone-cli-installer-v6
