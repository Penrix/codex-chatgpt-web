name: Windows Catalog Compatibility Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  catalog-compat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -GitHubEnv $env:GITHUB_ENV
      - name: Typecheck bridge
        run: bun run typecheck
      - name: Run catalog compatibility tests
        run: bun test ./tests/native-model-catalog-fallback.test.ts ./tests/server-models.test.ts ./tests/native-passthrough.test.ts
      - name: Build runtime bundle
        run: bun run build
      - name: Package Windows launcher
        if: runner.os == 'Windows'
        run: bun run app:package
      - name: Smoke packaged Windows launcher
        if: runner.os == 'Windows'
        run: bun run app:smoke
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: codex-web-gpt-windows-catalog-fix
          path: launcher/artifacts/*.exe
          if-no-files-found: error
