name: Windows Catalog Compatibility Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  catalog-compat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Typecheck bridge
        run: bun run typecheck
      - name: Run catalog compatibility tests
        run: bun test ./tests/native-model-catalog-fallback.test.ts ./tests/server-models.test.ts ./tests/native-passthrough.test.ts
      - name: Build runtime bundle
        run: bun run build
