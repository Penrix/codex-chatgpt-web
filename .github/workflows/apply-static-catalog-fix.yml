name: Apply static catalog compatibility fix

on:
  push:
    branches: [fix/windows-codex-026903-static-catalog]
    paths: [.github/workflows/apply-static-catalog-fix.yml]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/windows-codex-026903-static-catalog
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Apply compatibility patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path("src/codex-bundled-catalog.ts").write_text(r'''import { spawnSync } from "node:child_process";
          import { readdirSync, statSync } from "node:fs";
          import { join } from "node:path";
          import type { AppConfig } from "./config";
          import { getConfigDir } from "./config";
          import { augmentNativeModelCatalog } from "./model-catalog";

          export interface BundledCodexCatalog {
            models: unknown[];
            [key: string]: unknown;
          }

          export interface ManagedCodexCatalogArtifact {
            path: string;
            data: string;
          }

          interface CommandResult {
            status: number | null;
            error?: Error;
            stdout: string;
          }

          interface BundledCatalogOptions {
            platform?: NodeJS.Platform;
            localAppData?: string;
            run?: (executable: string, args: string[]) => CommandResult;
          }

          export function findWindowsCodexExecutables(localAppData: string): string[] {
            const binRoot = join(localAppData, "OpenAI", "Codex", "bin");
            let entries;
            try {
              entries = readdirSync(binRoot, { withFileTypes: true });
            } catch {
              return [];
            }
            return entries
              .filter(entry => entry.isDirectory() && /^[a-f0-9]{12,64}$/i.test(entry.name))
              .map(entry => {
                const executable = join(binRoot, entry.name, "codex.exe");
                try {
                  const stat = statSync(executable);
                  return stat.isFile() ? { executable, modifiedAt: stat.mtimeMs } : undefined;
                } catch {
                  return undefined;
                }
              })
              .filter((candidate): candidate is { executable: string; modifiedAt: number } => Boolean(candidate))
              .sort((left, right) => right.modifiedAt - left.modifiedAt)
              .map(candidate => candidate.executable);
          }

          export function parseBundledCodexCatalog(stdout: string): BundledCodexCatalog | undefined {
            try {
              const parsed = JSON.parse(stdout) as unknown;
              if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return undefined;
              const models = (parsed as { models?: unknown }).models;
              if (!Array.isArray(models) || models.length === 0) return undefined;
              return parsed as BundledCodexCatalog;
            } catch {
              return undefined;
            }
          }

          function defaultRun(executable: string, args: string[]): CommandResult {
            const result = spawnSync(executable, args, {
              encoding: "utf8",
              stdio: ["ignore", "pipe", "pipe"],
              timeout: 10_000,
              windowsHide: true,
              maxBuffer: 64 * 1024 * 1024,
            });
            return {
              status: result.status,
              ...(result.error ? { error: result.error } : {}),
              stdout: result.stdout ?? "",
            };
          }

          export function loadBundledWindowsCodexCatalog(
            options: BundledCatalogOptions = {},
          ): BundledCodexCatalog | undefined {
            const platform = options.platform ?? process.platform;
            const localAppData = options.localAppData ?? process.env.LOCALAPPDATA?.trim();
            if (platform !== "win32" || !localAppData) return undefined;
            const run = options.run ?? defaultRun;
            for (const executable of findWindowsCodexExecutables(localAppData)) {
              const result = run(executable, ["debug", "models", "--bundled"]);
              if (result.status !== 0 || result.error) continue;
              const catalog = parseBundledCodexCatalog(result.stdout);
              if (catalog) return catalog;
            }
            return undefined;
          }

          export function getManagedCodexCatalogPath(): string {
            return join(getConfigDir(), "codex", "model-catalog.json");
          }

          export function buildManagedWindowsCodexCatalog(
            config: AppConfig,
            options: BundledCatalogOptions = {},
          ): ManagedCodexCatalogArtifact | undefined {
            const platform = options.platform ?? process.platform;
            if (platform !== "win32") return undefined;
            const nativeCatalog = loadBundledWindowsCodexCatalog({ ...options, platform });
            if (!nativeCatalog) {
              throw new Error(
                "Windows Codex model catalog is unavailable; expected the installed Codex CLI to support `debug models --bundled`",
              );
            }
            const merged = augmentNativeModelCatalog(nativeCatalog, config);
            return {
              path: getManagedCodexCatalogPath(),
              data: `${JSON.stringify(merged, null, 2)}\n`,
            };
          }
          '''.replace("\n          ", "\n").lstrip(), encoding="utf-8")

          Path("src/codex-static-catalog-route.ts").write_text(r'''import type { PreviousAssignment } from "./codex-integration-shared";
          import {
            findTopLevelAssignment,
            firstTableIndex,
            insertDocumentLine,
            parseDocument,
            removeDocumentLine,
            renderDocument,
          } from "./codex-integration-document";

          function sameAssignment(current: PreviousAssignment, previous: PreviousAssignment): boolean {
            return current.present === previous.present
              && (!current.present || (current.value === previous.value && current.rawLine === previous.rawLine));
          }

          export function installManagedModelCatalog(
            text: string,
            catalogPath: string,
            replaceExisting: boolean,
          ): string {
            const document = parseDocument(text);
            const current = findTopLevelAssignment(document.lines, "model_catalog_json");
            if (current.present && current.value !== catalogPath && !replaceExisting) {
              throw new Error(
                `Codex already configures model_catalog_json=${JSON.stringify(current.value)}. `
                + "Rerun with --replace-codex-route to replace it reversibly.",
              );
            }
            const line = `model_catalog_json = ${JSON.stringify(catalogPath)}`;
            if (current.index !== undefined) document.lines[current.index] = line;
            else insertDocumentLine(document, firstTableIndex(document.lines), line);
            return renderDocument(document);
          }

          export function restoreManagedModelCatalog(
            text: string,
            catalogPath: string,
            previous: PreviousAssignment,
            options: { allowChanged?: boolean } = {},
          ): string {
            const document = parseDocument(text);
            const current = findTopLevelAssignment(document.lines, "model_catalog_json");
            if (current.value === catalogPath && current.index !== undefined) {
              if (previous.present) {
                if (!previous.rawLine) throw new Error("Codex integration journal is missing the prior model_catalog_json line");
                document.lines[current.index] = previous.rawLine;
              } else {
                removeDocumentLine(document, current.index);
              }
              return renderDocument(document);
            }
            if (sameAssignment(current, previous) || options.allowChanged === true) return text;
            throw new Error("Codex model_catalog_json changed after setup; refusing to overwrite the user's newer value");
          }

          export function verifyManagedModelCatalogInstalled(text: string, catalogPath: string): boolean {
            const current = findTopLevelAssignment(parseDocument(text).lines, "model_catalog_json");
            return current.present && current.value === catalogPath;
          }

          export function verifyManagedModelCatalogRestored(text: string, previous: PreviousAssignment): void {
            const current = findTopLevelAssignment(parseDocument(text).lines, "model_catalog_json");
            if (!sameAssignment(current, previous)) {
              throw new Error("Codex model_catalog_json changed while the bridge was disconnected");
            }
          }
          '''.replace("\n          ", "\n").lstrip(), encoding="utf-8")

          p = Path("src/codex-integration.ts")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              'import { getConfigPath, loadConfig, saveConfig } from "./config";\n',
              'import { getConfigPath, loadConfig, saveConfig } from "./config";\n'
              'import { buildManagedWindowsCodexCatalog, getManagedCodexCatalogPath, type ManagedCodexCatalogArtifact } from "./codex-bundled-catalog";\n'
          )
          text = text.replace(
              'import { assertJournalTargetsConfig, readJournal } from "./codex-integration-journal";\n',
              'import { assertJournalTargetsConfig, readJournal } from "./codex-integration-journal";\n'
              'import {\n'
              '  installManagedModelCatalog,\n'
              '  restoreManagedModelCatalog,\n'
              '  verifyManagedModelCatalogInstalled,\n'
              '  verifyManagedModelCatalogRestored,\n'
              '} from "./codex-static-catalog-route";\n'
          )
          anchor = 'function installConfiguredRoute(\n'
          helpers = r'''function catalogPrevious(journal: Exclude<AnyCodexIntegrationJournal, { version: 2 }>) {
            return journal.previous.model_catalog_json;
          }

          function verifyManagedCatalogFile(path: string): void {
            if (!existsSync(path)) throw new Error(`Managed Codex model catalog is missing: ${path}`);
            let parsed: unknown;
            try {
              parsed = JSON.parse(readFileSync(path, "utf8"));
            } catch (error) {
              throw new Error(`Managed Codex model catalog is invalid JSON: ${error instanceof Error ? error.message : String(error)}`);
            }
            const models = parsed && typeof parsed === "object" && !Array.isArray(parsed)
              ? (parsed as { models?: unknown }).models
              : undefined;
            if (!Array.isArray(models)
              || !models.some(model => model && typeof model === "object" && !Array.isArray(model)
                && typeof (model as { slug?: unknown }).slug === "string"
                && (model as { slug: string }).slug.startsWith("chatgpt-web/"))) {
              throw new Error("Managed Codex model catalog does not contain ChatGPT Web models");
            }
          }

          function verifyManagedIntegrationState(
            text: string,
            journal: Exclude<AnyCodexIntegrationJournal, { version: 2 }>,
          ): boolean {
            verifyManagedJournalState(text, journal);
            if (journal.version !== 10 || process.platform !== "win32") return false;
            const catalogPath = getManagedCodexCatalogPath();
            if (verifyManagedModelCatalogInstalled(text, catalogPath)) {
              verifyManagedCatalogFile(catalogPath);
              return true;
            }
            verifyManagedModelCatalogRestored(text, catalogPrevious(journal));
            return false;
          }

          function verifyRestoredIntegrationState(
            text: string,
            journal: Exclude<AnyCodexIntegrationJournal, { version: 2 }>,
          ): void {
            verifyRestoredRoute(text, journal);
            if (journal.version === 10 && process.platform === "win32") {
              verifyManagedModelCatalogRestored(text, catalogPrevious(journal));
            }
          }

          function restoreManagedIntegrationRoute(
            text: string,
            journal: Exclude<AnyCodexIntegrationJournal, { version: 2 }>,
            options: { allowChangedCatalog?: boolean } = {},
          ): string {
            const restored = restoreManagedRoute(text, journal);
            if (journal.version !== 10 || process.platform !== "win32") return restored;
            return restoreManagedModelCatalog(
              restored,
              getManagedCodexCatalogPath(),
              catalogPrevious(journal),
              { allowChanged: options.allowChangedCatalog === true },
            );
          }

          function replacementIntegrationBaseline(
            currentText: string,
            configExists: boolean,
            journal: Exclude<AnyCodexIntegrationJournal, { version: 2 }>,
          ): string {
            const baseline = replacementBaseline(currentText, configExists, journal);
            if (journal.version !== 10 || process.platform !== "win32") return baseline;
            return restoreManagedModelCatalog(
              baseline,
              getManagedCodexCatalogPath(),
              catalogPrevious(journal),
              { allowChanged: true },
            );
          }

          function commitInstalledIntegration(
            journal: CodexIntegrationJournal,
            configText: string,
            managedCatalog: ManagedCodexCatalogArtifact | undefined,
          ): void {
            const catalogSnapshot = managedCatalog ? snapshotFile(managedCatalog.path) : undefined;
            try {
              if (managedCatalog && catalogSnapshot) writeFileSnapshot(catalogSnapshot, managedCatalog.data);
              writeIntegrationState(
                journal,
                { path: journal.configPath, data: configText },
                [getCodexModelsCachePath()],
              );
            } catch (error) {
              if (catalogSnapshot) {
                try { restoreFileSnapshot(catalogSnapshot); } catch { /* Integration state already rolls back its own files. */ }
              }
              throw error;
            }
          }

          '''.replace("\n          ", "\n")
          if anchor not in text:
              raise SystemExit("installConfiguredRoute anchor missing")
          text = text.replace(anchor, helpers + anchor, 1)
          text = text.replace(
              '  const route = installRoute(\n    baseline,\n    installedUrl,\n    replaceExistingRoute,\n    replaceExistingRealtimeRoute,\n  );\n  const configured = config.subagentProtocol === "compatibility-v1"\n',
              '  const route = installRoute(\n    baseline,\n    installedUrl,\n    replaceExistingRoute,\n    replaceExistingRealtimeRoute,\n  );\n  const routedText = process.platform === "win32"\n    ? installManagedModelCatalog(route.text, getManagedCodexCatalogPath(), replaceExistingRoute)\n    : route.text;\n  const configured = config.subagentProtocol === "compatibility-v1"\n'
          )
          text = text.replace('        const features = installCompatibilityV1Features(route.text);', '        const features = installCompatibilityV1Features(routedText);')
          text = text.replace('    : route;\n  const hook =', '    : { ...route, text: routedText };\n  const hook =', 1)
          text = text.replace('      verifyManagedJournalState(currentText, existing);', '      verifyManagedIntegrationState(currentText, existing);')
          text = text.replace('        replacementBaseline(currentText, configExists, existing),', '        replacementIntegrationBaseline(currentText, configExists, existing),')
          text = text.replace('      ? restoreManagedRoute(currentText, existing)', '      ? restoreManagedIntegrationRoute(currentText, existing)')
          text = text.replace('  const installedUrl = routeUrl(config);\n  if (existing) assertJournalTargetsConfig(existing, configPath);', '  const installedUrl = routeUrl(config);\n  const managedCatalog = buildManagedWindowsCodexCatalog(config);\n  if (existing) assertJournalTargetsConfig(existing, configPath);', 1)
          text = text.replace('      verifyManagedJournalState(currentText, existing);', '      verifyManagedIntegrationState(currentText, existing);')
          text = text.replace('        ? restoreManagedRoute(currentText, existing)', '        ? restoreManagedIntegrationRoute(currentText, existing)')
          text = text.replace('      baseline = replacementBaseline(currentText, configExists, existing);', '      baseline = replacementIntegrationBaseline(currentText, configExists, existing);')
          text = text.replace('    writeIntegrationState(updated, { path: configPath, data: patched.text }, [getCodexModelsCachePath()]);', '    commitInstalledIntegration(updated, patched.text, managedCatalog);')
          text = text.replace('  writeIntegrationState(journal, { path: configPath, data: patched.text }, [getCodexModelsCachePath()]);', '  commitInstalledIntegration(journal, patched.text, managedCatalog);')
          text = text.replace('    verifyRestoredRoute(current, existing);', '    verifyRestoredIntegrationState(current, existing);', 1)
          text = text.replace('  const restored = restoreManagedRoute(current, existing);', '  const restored = restoreManagedIntegrationRoute(current, existing);', 1)
          text = text.replace(
              '  if (existing.version === 10 && existing.active) {\n    verifyInstalledRoute(current, existing);\n    return { changed: false, active: true };\n  }',
              '  if (existing.version === 10 && existing.active) {\n    const staticCatalogActive = verifyManagedIntegrationState(current, existing);\n    if (process.platform !== "win32" || staticCatalogActive) return { changed: false, active: true };\n  }'
          )
          text = text.replace('    verifyRestoredRoute(current, existing);\n    baseline = current;', '    verifyRestoredIntegrationState(current, existing);\n    baseline = current;', 1)
          text = text.replace('    verifyInstalledRoute(current, existing);\n    baseline = restoreManagedRoute(current, existing);', '    verifyManagedIntegrationState(current, existing);\n    baseline = restoreManagedIntegrationRoute(current, existing);', 1)
          text = text.replace(
              '  const protocol = journalProtocol(existing);\n  const hookConfig = existing.version === 10\n    ? { interruptHookCommand: existing.interruptHook.command }\n    : { runtimeCommand: loadConfig().runtimeCommand };',
              '  const protocol = journalProtocol(existing);\n  const appConfig = loadConfig();\n  const managedCatalog = buildManagedWindowsCodexCatalog(appConfig);\n  const hookConfig = existing.version === 10\n    ? { interruptHookCommand: existing.interruptHook.command }\n    : { runtimeCommand: appConfig.runtimeCommand };'
          )
          text = text.replace('  writeIntegrationState(connected, { path: existing.configPath, data: route.text }, [getCodexModelsCachePath()]);', '  commitInstalledIntegration(connected, route.text, managedCatalog);')
          text = text.replace('    verifyRestoredRoute(current, journal);\n    restored = current;', '    verifyRestoredIntegrationState(current, journal);\n    restored = current;', 1)
          text = text.replace('    restored = restoreManagedRoute(current, journal);', '    restored = restoreManagedIntegrationRoute(current, journal);', 1)
          text = text.replace('  const configSnapshot = snapshotFile(journal.configPath, { followSymlink: true });\n  const catalogSnapshot = journal.version === 2 ? snapshotFile(journal.catalogPath) : undefined;', '  const configSnapshot = snapshotFile(journal.configPath, { followSymlink: true });\n  const catalogSnapshot = journal.version === 2 ? snapshotFile(journal.catalogPath) : undefined;\n  const managedCatalogSnapshot = snapshotFile(getManagedCodexCatalogPath());')
          text = text.replace('    if (catalogSnapshot?.exists) rmSync(catalogSnapshot.path);\n    rmSync(modelsCacheSnapshot.path, { force: true });', '    if (catalogSnapshot?.exists) rmSync(catalogSnapshot.path);\n    rmSync(managedCatalogSnapshot.path, { force: true });\n    rmSync(modelsCacheSnapshot.path, { force: true });')
          text = text.replace('    for (const snapshot of [recoverySnapshot, journalSnapshot, modelsCacheSnapshot, catalogSnapshot, configSnapshot]) {', '    for (const snapshot of [recoverySnapshot, journalSnapshot, modelsCacheSnapshot, managedCatalogSnapshot, catalogSnapshot, configSnapshot]) {')
          text = text.replace('  const journal = readJournal();\n  const errors: string[] = [];', '  const journal = readJournal();\n  const errors: string[] = [];\n  let staticCatalogActive = false;', 1)
          text = text.replace('        verifyRestoredRoute(text, journal);', '        verifyRestoredIntegrationState(text, journal);')
          text = text.replace('        verifyInstalledRoute(text, journal);', '        staticCatalogActive = verifyManagedIntegrationState(text, journal);')
          text = text.replace('    errors,\n  };\n}', '    staticCatalogActive,\n    errors,\n  };\n}', 1)
          text = text.replace('  errors: string[];\n} {', '  staticCatalogActive: boolean;\n  errors: string[];\n} {', 1)
          p.write_text(text, encoding="utf-8")

          Path("tests/codex-static-catalog.test.ts").write_text(r'''import { expect, test } from "bun:test";
          import { mkdirSync, mkdtempSync, rmSync, writeFileSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { dirname, join } from "node:path";
          import {
            buildManagedWindowsCodexCatalog,
            findWindowsCodexExecutables,
            loadBundledWindowsCodexCatalog,
          } from "../src/codex-bundled-catalog";
          import { defaultConfig } from "../src/config";
          import {
            installManagedModelCatalog,
            restoreManagedModelCatalog,
            verifyManagedModelCatalogInstalled,
          } from "../src/codex-static-catalog-route";
          import { splitLines, findTopLevelAssignment } from "../src/codex-integration-document";

          const nativeCatalog = {
            models: [{
              slug: "gpt-5.6-sol",
              display_name: "GPT-5.6 Sol",
              description: "Native model",
              visibility: "list",
              supported_in_api: true,
              priority: 1,
              default_reasoning_level: "high",
              supported_reasoning_levels: [{ effort: "high", description: "High" }],
              tool_mode: "code_mode_only",
              multi_agent_version: "v1",
              input_modalities: ["text", "image"],
              context_window: 272000,
              max_context_window: 872000,
              effective_context_window_percent: 95,
            }],
          };

          test("discovers the 16-hex Codex Desktop CLI directory", () => {
            const localAppData = mkdtempSync(join(tmpdir(), "codex-static-catalog-"));
            try {
              const executable = join(localAppData, "OpenAI", "Codex", "bin", "fd4c151a749f3ab4", "codex.exe");
              mkdirSync(dirname(executable), { recursive: true });
              writeFileSync(executable, "");
              expect(findWindowsCodexExecutables(localAppData)).toEqual([executable]);
            } finally {
              rmSync(localAppData, { recursive: true, force: true });
            }
          });

          test("reads Codex's bundled JSON through the installed CLI contract", () => {
            const localAppData = mkdtempSync(join(tmpdir(), "codex-static-catalog-"));
            try {
              const executable = join(localAppData, "OpenAI", "Codex", "bin", "fd4c151a749f3ab4", "codex.exe");
              mkdirSync(dirname(executable), { recursive: true });
              writeFileSync(executable, "");
              const catalog = loadBundledWindowsCodexCatalog({
                platform: "win32",
                localAppData,
                run: (candidate, args) => ({
                  status: candidate === executable && args.join(" ") === "debug models --bundled" ? 0 : 1,
                  stdout: JSON.stringify(nativeCatalog),
                }),
              });
              expect(catalog).toEqual(nativeCatalog);
            } finally {
              rmSync(localAppData, { recursive: true, force: true });
            }
          });

          test("builds a native plus ChatGPT Web catalog without calling /models", () => {
            const localAppData = mkdtempSync(join(tmpdir(), "codex-static-catalog-"));
            try {
              const executable = join(localAppData, "OpenAI", "Codex", "bin", "fd4c151a749f3ab4", "codex.exe");
              mkdirSync(dirname(executable), { recursive: true });
              writeFileSync(executable, "");
              const artifact = buildManagedWindowsCodexCatalog(defaultConfig(), {
                platform: "win32",
                localAppData,
                run: () => ({ status: 0, stdout: JSON.stringify(nativeCatalog) }),
              });
              expect(artifact).toBeDefined();
              const parsed = JSON.parse(artifact!.data) as { models: Array<{ slug: string }> };
              expect(parsed.models.some(model => model.slug === "gpt-5.6-sol")).toBe(true);
              expect(parsed.models.some(model => model.slug.startsWith("chatgpt-web/"))).toBe(true);
            } finally {
              rmSync(localAppData, { recursive: true, force: true });
            }
          });

          test("managed model_catalog_json is reversible", () => {
            const original = 'model_catalog_json = "C:\\\\native.json"\r\n[features]\r\nmulti_agent = true\r\n';
            const previous = findTopLevelAssignment(splitLines(original), "model_catalog_json");
            const managedPath = "C:\\Users\\123\\.codex-chatgpt-web\\codex\\model-catalog.json";
            const installed = installManagedModelCatalog(original, managedPath, true);
            expect(verifyManagedModelCatalogInstalled(installed, managedPath)).toBe(true);
            expect(restoreManagedModelCatalog(installed, managedPath, previous)).toBe(original);
          });
          '''.replace("\n          ", "\n").lstrip(), encoding="utf-8")

          main = Path("launcher/electron/main.cjs")
          text = main.read_text(encoding="utf-8")
          old = '''      const config = runtimeSupervisor.readConfig();
                const health = await runtimeSupervisor.proxyHealthPayload(config);'''.replace("\n                ", "\n      ")
          new = '''      const route = await runtimeHost.bridgeStatus("catalog-verification");
                if (route.staticCatalogActive === true) {
                  const state = stateStore.update({
                    codexCatalogVerified: true,
                    codexRestartRequired: true,
                  });
                  logger.info("codex.static_model_catalog_installed");
                  send("launcher:state-changed", state);
                  stopCatalogVerificationMonitor();
                  return;
                }
                const config = runtimeSupervisor.readConfig();
                const health = await runtimeSupervisor.proxyHealthPayload(config);'''.replace("\n                ", "\n      ")
          if old not in text:
              raise SystemExit("launcher catalog verification anchor missing")
          main.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - run: bun run typecheck
      - run: bun test ./tests/codex-static-catalog.test.ts ./tests/codex-integration.test.ts ./tests/server-models.test.ts ./tests/native-passthrough.test.ts
      - run: bun run build
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex-bundled-catalog.ts src/codex-static-catalog-route.ts src/codex-integration.ts launcher/electron/main.cjs tests/codex-static-catalog.test.ts
          git commit -m "fix: install a managed static catalog for Windows Codex"
          git push origin HEAD:fix/windows-codex-026903-static-catalog
